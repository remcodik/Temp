name: Init historische watertemperatuur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Haal Lobith data op per week
        run: |
          python3 -u << 'PYEOF'
          import json, datetime, urllib.request, urllib.parse, time, csv, io

          TARGET = 8 * 60 + 30  # 08:30

          def fetch_waterinfo_csv(start_date, end_date):
              """Probeer waterinfo.rws.nl download API voor historische Lobith data."""
              start_str = start_date.strftime("%Y-%m-%dT00:00:00")
              end_str   = end_date.strftime("%Y-%m-%dT23:59:59")
              url = (
                  "https://waterinfo.rws.nl/api/Download/CSV"
                  "?expertParameter=Watertemperatuur___20"
                  "&locationSlug=lobith-ponton"
                  f"&startDate={urllib.parse.quote(start_str)}"
                  f"&endDate={urllib.parse.quote(end_str)}"
              )
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read().decode("utf-8-sig")
                  if not body.strip() or body.strip().startswith("<"):
                      return None
                  reader = csv.DictReader(io.StringIO(body), delimiter=";")
                  rows = list(reader)
                  print(f"  [waterinfo csv] {len(rows)} rijen", flush=True)
                  return rows
              except Exception as e:
                  print(f"  [waterinfo csv] fout: {e}", flush=True)
                  return None

          def fetch_ddapi_week(start_date, end_date):
              """Probeer DD-API v2.0 met lobith.ponton."""
              BASE = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES"
              start_str = start_date.strftime("%Y-%m-%dT00:00:00.000+01:00")
              end_str   = end_date.strftime("%Y-%m-%dT23:59:00.000+01:00")
              payload = json.dumps({
                  "Locatie": {"Code": "lobith.ponton"},
                  "AquoPlusWaarnemingMetadata": {
                      "AquoMetadata": {"Compartiment": {"Code": "OW"}, "Grootheid": {"Code": "T"}}
                  },
                  "Periode": {"Begindatumtijd": start_str, "Einddatumtijd": end_str}
              }).encode()
              try:
                  req = urllib.request.Request(f"{BASE}/OphalenWaarnemingen", data=payload,
                          headers={"Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                  if not body:
                      return None
                  data = json.loads(body)
                  return data if data.get("WaarnemingenLijst") else None
              except Exception as e:
                  print(f"  [ddapi] fout: {e}", flush=True)
                  return None

          def fetch_week(start_date, end_date):
              # Probeer waterinfo CSV eerst
              rows = fetch_waterinfo_csv(start_date, end_date)
              if rows:
                  result = {}
                  for row in rows:
                      # Zoek datum en waarde kolommen (namen kunnen variëren)
                      t = row.get("Tijdstip") or row.get("DateTime") or row.get("Datum") or ""
                      v_str = row.get("Waarde") or row.get("Value") or row.get("Numeriekewaarde") or ""
                      if not t or not v_str:
                          # Probeer eerste twee kolommen
                          vals = list(row.values())
                          if len(vals) >= 2:
                              t, v_str = vals[0], vals[1]
                      try:
                          v = float(v_str.replace(",", "."))
                          dag = t[:10]
                          h = int(t[11:13]) if len(t) > 12 else 8
                          mn = int(t[14:16]) if len(t) > 15 else 30
                          diff = abs(h * 60 + mn - TARGET)
                          if dag not in result or diff < result[dag][1]:
                              result[dag] = (v, diff)
                      except Exception:
                          pass
                  if result:
                      print(f"  [waterinfo] {len(result)} dagen gevonden", flush=True)
                      return ("csv", result)

              # Fallback: DD-API
              data = fetch_ddapi_week(start_date, end_date)
              if data:
                  return ("ddapi", data)
              return None

          today = datetime.date.today()
          start = datetime.date(2026, 1, 1)
          per_dag = {}

          week_start = start
          while week_start <= today:
              week_end = min(week_start + datetime.timedelta(days=6), today)
              print(f"Ophalen {week_start} t/m {week_end}...", flush=True)
              result = fetch_week(week_start, week_end)
              if result is None:
                  print(f"  mislukt, overgeslagen", flush=True)
              else:
                  kind, data = result
                  if kind == "csv":
                      for dag, (v, diff) in data.items():
                          if dag not in per_dag or diff < per_dag[dag][1]:
                              per_dag[dag] = (v, diff)
                  else:
                      for w in data.get("WaarnemingenLijst", []):
                          for m in w.get("MetingenLijst", []):
                              v = m.get("Meetwaarde", {}).get("Waarde_Numeriek")
                              t = m.get("Tijdstip", "")
                              if v is None or not t:
                                  continue
                              dag = t[:10]
                              try:
                                  h, mn = int(t[11:13]), int(t[14:16])
                                  diff = abs(h * 60 + mn - TARGET)
                              except Exception:
                                  diff = 9999
                              if dag not in per_dag or diff < per_dag[dag][1]:
                                  per_dag[dag] = (v, diff)
                  print(f"  OK — {len(per_dag)} dagen totaal", flush=True)
              time.sleep(1)
              week_start = week_end + datetime.timedelta(days=1)

          print(f"Klaar: {len(per_dag)} dagen gevonden", flush=True)

          try:
              with open("temp-history.json") as f:
                  history = json.load(f)
          except Exception:
              history = []

          hist_map = {e["date"]: e for e in history}
          for dag, (val, _) in per_dag.items():
              hist_map.setdefault(dag, {"date": dag})["lobith"] = round(val * 10) / 10

          history = sorted(hist_map.values(), key=lambda e: e["date"], reverse=True)[:365]
          with open("temp-history.json", "w") as f:
              json.dump(history, f, indent=2)

          print(f"Opgeslagen: {len(history)} regels in temp-history.json", flush=True)
          PYEOF

      - name: Commit en push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add temp-history.json
          git diff --staged --quiet && echo "Geen wijziging" || \
            git commit -m "Init Lobith historische watertemperatuur [skip ci]"
          git pull --rebase origin HEAD
          git push
