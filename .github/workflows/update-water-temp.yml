name: Update Water Temperature

on:
  schedule:
    # GitHub draait op vaste UTC-tijd (geen zomertijd). Om altijd om 08:00
    # Nederlandse tijd te draaien, triggeren we op beide mogelijke UTC-tijden
    # en laat de 'gate'-job alleen de run door om 08:00 lokale tijd:
    - cron: '0 6 * * *'   # 08:00 in zomertijd (CEST, UTC+2)
    - cron: '0 7 * * *'   # 08:00 in wintertijd (CET, UTC+1)
  workflow_dispatch:         # Handmatig starten mogelijk (altijd)

permissions:
  contents: write
  actions: write   # nodig om de Pages-deploy te triggeren na een data-update

jobs:
  # Poortwachter: bepaalt of de update mag draaien (exact 08:00 NL, of handmatig)
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Handmatige start — altijd draaien."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ='Europe/Amsterdam' date +%H)" = "08" ]; then
            echo "Lokale tijd is 08:00 — draaien."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Lokale tijd is $(TZ='Europe/Amsterdam' date +%H):00, niet 08:00 — overslaan."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch watertemperatuur (Nijmegen of Lobith via RWS)
        id: fetch
        run: |
          RESP=""
          USED_STATION=""

          # Probeer Nijmegen-haven op oude API (code NIJM)
          RESP=$(curl -s --max-time 10 -X POST \
            "https://waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES_DBO/OphalenLaatsteWaarnemingen" \
            -H "Content-Type: application/json" \
            -d '{"LocatieLijst":[{"Code":"NIJM"}],"AquoPlusWaarnemingMetadataLijst":[{"AquoMetadata":{"Compartiment":{"Code":"OW"},"Grootheid":{"Code":"T"}},"WaarnemingMetadata":{"KwaliteitswaardecodeLijst":["00","10","20","25","30","40"]}}]}' 2>/dev/null)
          if echo "$RESP" | grep -q "Waarde_Numeriek"; then
            USED_STATION="NIJM"
            echo "Nijmegen gevonden: ${RESP:0:200}"
          fi

          # Fallback: Lobith op nieuwe DD-API v2.0
          if [ -z "$USED_STATION" ]; then
            RESP=$(curl -s --max-time 10 -X POST \
              "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen" \
              -H "Content-Type: application/json" \
              -d '{"LocatieLijst":[{"Code":"lobith.ponton"}],"AquoPlusWaarnemingMetadataLijst":[{"AquoMetadata":{"Compartiment":{"Code":"OW"},"Grootheid":{"Code":"T"}},"WaarnemingMetadata":{"KwaliteitswaardecodeLijst":["00","10","20","25","30","40"]}}]}' 2>/dev/null)
            if echo "$RESP" | grep -q "Waarde_Numeriek"; then
              USED_STATION="lobith.ponton"
            fi
          fi

          # Laatste fallback: Lobith op oude API
          if [ -z "$USED_STATION" ]; then
            RESP=$(curl -s --max-time 10 -X POST \
              "https://waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES_DBO/OphalenLaatsteWaarnemingen" \
              -H "Content-Type: application/json" \
              -d '{"LocatieLijst":[{"Code":"LOBH"}],"AquoPlusWaarnemingMetadataLijst":[{"AquoMetadata":{"Compartiment":{"Code":"OW"},"Grootheid":{"Code":"T"}},"WaarnemingMetadata":{"KwaliteitswaardecodeLijst":["00","10","20","25","30","40"]}}]}' 2>/dev/null)
            USED_STATION="LOBH"
          fi

          echo "Gebruikt station: $USED_STATION"
          echo "rws_response=$RESP" >> $GITHUB_OUTPUT
          echo "used_station=$USED_STATION" >> $GITHUB_OUTPUT

      - name: Parse en sla op als water-temp.json
        run: |
          python3 - <<'PYEOF'
          import json, datetime, sys, os

          rws_raw = """${{ steps.fetch.outputs.rws_response }}"""
          used_station = os.environ.get("USED_STATION", "").strip()

          # Bepaal label op basis van station
          if any(x in used_station.lower() for x in ["nijmegen", "nijm"]):
              label = "Nijmegen (Waal)"
              source = "RWS"
          else:
              label = "Lobith"
              source = "RWS"

          val = None
          try:
              data = json.loads(rws_raw)
              for w in data.get("WaarnemingenLijst", []):
                  for m in w.get("MetingenLijst", []):
                      v = m.get("Meetwaarde", {}).get("Waarde_Numeriek")
                      if v is not None:
                          val = round(v * 10) / 10
                          break
                  if val is not None:
                      break
          except Exception as e:
              print(f"Parse fout: {e}", file=sys.stderr)

          result = {
              "temperature": val,
              "label": label,
              "source": source,
              "updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          }

          # Behoud waterkaart-veld uit vorige run als fallback
          try:
              with open("water-temp.json") as f:
                  old = json.load(f)
              if "waterkaart" in old:
                  result["waterkaart"] = old["waterkaart"]
          except Exception:
              pass

          with open("water-temp.json", "w") as f:
              json.dump(result, f)

          print("Resultaat:", result)
          PYEOF
        env:
          USED_STATION: ${{ steps.fetch.outputs.used_station }}

      - name: Fetch watertemperatuur + waterkwaliteit De Lentse Plas (waterkaart.net)
        run: |
          python3 - <<'PYEOF'
          import json, re, datetime, urllib.request

          URL = "https://waterkaart.net/gids/zwemplek.php?naam=De%20Lentse%20Plas"
          html = None
          val = None
          try:
              req = urllib.request.Request(URL, headers={
                  "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1",
                  "Accept-Language": "nl-NL,nl;q=0.9",
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  html = r.read().decode("utf-8", errors="replace")
          except Exception as e:
              print(f"Waterkaart fetch fout: {e}")

          now_iso = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          # ── Watertemperatuur ──
          # Voorbeeld: <span class="meet-label">Watertemperatuur</span><span class="meet-waarde">~23.2</span>
          if html:
              m = re.search(
                  r'Watertemperatuur</span>\s*<span class="meet-waarde">\s*~?\s*([0-9]+(?:[.,][0-9]+)?)',
                  html)
              if m:
                  val = round(float(m.group(1).replace(",", ".")), 1)
                  print(f"Waterkaart De Lentse Plas: {val}°C")
              else:
                  print("Geen watertemperatuur gevonden op waterkaart-pagina")

          # ── Waterkwaliteit ──
          # Status: <span class="meet-waarde bold oranje">waarschuwing</span>  (kleur = groen/oranje/rood)
          quality = None
          if html:
              ms = re.search(
                  r'zwemwaterkwaliteit bij[^<]*?is\s*<span class="meet-waarde bold (\w+)">\s*([^<]+?)\s*</span>',
                  html)
              if ms:
                  quality = {
                      "status": ms.group(2).strip().lower(),
                      "color":  ms.group(1).strip().lower(),   # groen | oranje | rood
                      "cause": None,
                      "since": None,
                      "measured": None,
                      "updated": now_iso,
                  }
                  # Oorzaak (alleen aanwezig bij waarschuwing/afgeraden)
                  mo = re.search(
                      r'<b>Oorzaak</b>\s*<br>\s*(.*?)\s*<br>\s*<span class="meta-tekst">\s*Vanaf:\s*<span[^>]*>\s*([0-9]{2}-[0-9]{2}-[0-9]{4})',
                      html, re.S)
                  if mo:
                      cause = re.sub(r'<[^>]+>', '', mo.group(1))
                      quality["cause"] = cause.strip().rstrip('_ ').strip()
                      quality["since"] = mo.group(2).strip()
                  else:
                      mo2 = re.search(r'<b>Oorzaak</b>\s*<br>\s*(.*?)\s*<br>', html, re.S)
                      if mo2:
                          cause = re.sub(r'<[^>]+>', '', mo2.group(1))
                          quality["cause"] = cause.strip().rstrip('_ ').strip()
                  # Meetdatum kwaliteit
                  md = re.search(r'Kwaliteit:\s*([0-9]{2}-[0-9]{2}-[0-9]{4})', html)
                  if md:
                      quality["measured"] = md.group(1)
                  print(f"Waterkwaliteit: {quality['status']} ({quality['color']}) — {quality['cause']}")
              else:
                  print("Geen waterkwaliteit-status gevonden op waterkaart-pagina")

          try:
              with open("water-temp.json") as f:
                  wt = json.load(f)
          except Exception:
              wt = {}

          # Bij mislukte fetch blijft de vorige waarde staan
          if val is not None:
              wt["waterkaart"] = {
                  "temperature": val,
                  "label": "De Lentse Plas (waterkaart)",
                  "source": "waterkaart.net",
                  "updated": now_iso,
              }
          if quality is not None:
              wt["quality"] = quality

          with open("water-temp.json", "w") as f:
              json.dump(wt, f)

          print("water-temp.json:", wt)
          PYEOF

      - name: Update temp-history.json
        run: |
          python3 - <<'PYEOF'
          import json, datetime, os, sys, urllib.request

          now   = datetime.datetime.utcnow()
          today = now.strftime("%Y-%m-%d")

          # Lees huidige water-temp.json
          try:
              with open("water-temp.json") as f:
                  wt = json.load(f)
          except Exception:
              wt = {}

          nijmegen_val = wt.get("temperature") if "Nijmegen" in wt.get("label", "") else None

          # Waterkaart-waarde alleen in history als hij vandaag is opgehaald
          wk = wt.get("waterkaart") or {}
          waterkaart_val = wk.get("temperature")
          if waterkaart_val is not None and not str(wk.get("updated", "")).startswith(today):
              waterkaart_val = None

          # Haal Lobith 08:30-meting op voor history (vergelijkingsgrafiek)
          lobith_val = None
          TARGET = 8 * 60 + 30
          for api_url, payload_dict in [
              (
                "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenWaarnemingen",
                {"Locatie": {"Code": "lobith.ponton"}, "AquoPlusWaarnemingMetadata": {"AquoMetadata": {"Compartiment": {"Code": "OW"}, "Grootheid": {"Code": "T"}}}, "Periode": {"Begindatumtijd": today + "T00:00:00.000+01:00", "Einddatumtijd": today + "T23:59:00.000+01:00"}}
              )
          ]:
              try:
                  payload = json.dumps(payload_dict).encode()
                  req = urllib.request.Request(api_url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.loads(r.read())
                  best_val, best_diff = None, 9999
                  for w in data.get("WaarnemingenLijst", []):
                      for m in w.get("MetingenLijst", []):
                          v = m.get("Meetwaarde", {}).get("Waarde_Numeriek")
                          t = m.get("Tijdstip", "")
                          if v is None or not t: continue
                          try:
                              h, mn = int(t[11:13]), int(t[14:16])
                              diff = abs(h * 60 + mn - TARGET)
                          except Exception:
                              diff = 9999
                          if diff < best_diff:
                              best_val, best_diff = v, diff
                  if best_val is not None:
                      lobith_val = round(best_val * 10) / 10
                      print(f"Lobith 08:30-meting: {lobith_val}°C")
                      break
              except Exception as e:
                  print(f"Lobith fetch fout ({api_url}): {e}")

          # Lees bestaande history
          try:
              with open("temp-history.json") as f:
                  history = json.load(f)
          except Exception:
              history = []

          today_entry = next((e for e in history if e.get("date") == today), None)
          if today_entry and "nijmegen" in today_entry and "lobith" in today_entry and "waterkaart" in today_entry:
              print("Vandaag al opgeslagen, overgeslagen.")
              sys.exit(0)

          if today_entry is None:
              today_entry = {"date": today}
              history.append(today_entry)

          if nijmegen_val is not None:
              today_entry["nijmegen"] = nijmegen_val
          if lobith_val is not None:
              today_entry["lobith"] = lobith_val
          if waterkaart_val is not None:
              today_entry["waterkaart"] = waterkaart_val

          history.sort(key=lambda e: e.get("date", ""), reverse=True)
          history = history[:365]

          with open("temp-history.json", "w") as f:
              json.dump(history, f, indent=2)

          print(f"History bijgewerkt: {today_entry}")
          PYEOF

      - name: Commit en push
        id: commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add water-temp.json temp-history.json
          if git diff --staged --quiet; then
            echo "Geen wijziging"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update watertemperatuur [skip ci]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Pushes van de Actions-bot triggeren zelf geen workflows, dus zonder deze
      # stap komt de nieuwe data nooit op de live GitHub Pages-site terecht.
      - name: Trigger Pages-deploy zodat de app de nieuwe data ziet
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
          echo "Deploy getriggerd voor ${{ github.ref_name }}"
