name: Update Water Temperature

on:
  schedule:
    - cron: '15 * * * *'   # Elk uur op :15
  workflow_dispatch:         # Handmatig starten mogelijk

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch watertemperatuur Lentse Plas (waterkaart.net)
        id: waterkaart
        run: |
          RESP=$(curl -s --max-time 10 -X POST \
            "https://waterkaart.net/items/php/dbase_ophalen.php" \
            -H "Content-Type: application/x-www-form-urlencoded; charset=UTF-8" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://waterkaart.net/gids/zwemplek.php?naam=De%20Lentse%20Plas" \
            --data "a=51.865256042791536&b=5.894079208374023&c=51.891749018068246&d=5.834341049194336&e=1&f=1&g=1&h=1&i=1&j=1&k=1&l=1&m=1&n=1&o=1&p=1&q=1&r=1&s=1&t=1&u=1&v=1&w=1&x=1&y=0&z=0&een=0&z1=1&z2=1&z3=1&z4=1&z5=1&zoomlevel=14&userLang=nl" 2>/dev/null)

          # Haal temperatuur op uit patroon: zwemwater ~ 10&deg;C
          TEMP=$(echo "$RESP" | grep -oP 'zwemwater\s*~\s*\K[\d,\.]+(?=&deg;C)' | head -1)
          echo "waterkaart_temp=$TEMP" >> $GITHUB_OUTPUT
          echo "Waterkaart.net response (eerste 500 tekens): ${RESP:0:500}"
          echo "Gevonden temperatuur: $TEMP"

      - name: Fetch water temperature from RWS (fallback)
        id: fetch
        run: |
          RESULT=""

          # Probeer nieuwe RWS API (lobith.ponton)
          RESP=$(curl -s --max-time 10 -X POST \
            "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen" \
            -H "Content-Type: application/json" \
            -d '{"LocatieLijst":[{"Code":"lobith.ponton"}],"AquoPlusWaarnemingMetadataLijst":[{"AquoMetadata":{"Compartiment":{"Code":"OW"},"Grootheid":{"Code":"T"}},"WaarnemingMetadata":{"KwaliteitswaardecodeLijst":["00","10","20","25","30","40"]}}]}' 2>/dev/null)
          echo "Nieuw API (lobith.ponton): $RESP"

          # Probeer oude RWS API als fallback
          if ! echo "$RESP" | grep -q "Waarde_Numeriek"; then
            RESP=$(curl -s --max-time 10 -X POST \
              "https://waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES_DBO/OphalenLaatsteWaarnemingen" \
              -H "Content-Type: application/json" \
              -d '{"LocatieLijst":[{"Code":"LOBH"}],"AquoPlusWaarnemingMetadataLijst":[{"AquoMetadata":{"Compartiment":{"Code":"OW"},"Grootheid":{"Code":"T"}},"WaarnemingMetadata":{"KwaliteitswaardecodeLijst":["00","10","20","25","30","40"]}}]}' 2>/dev/null)
            echo "Oud API (LOBH): $RESP"
          fi

          echo "rws_response=$RESP" >> $GITHUB_OUTPUT

      - name: Parse en sla op als water-temp.json
        run: |
          python3 - <<'PYEOF'
          import json, datetime, sys, re, os

          waterkaart_temp = os.environ.get("WATERKAART_TEMP", "").strip()
          rws_raw = """${{ steps.fetch.outputs.rws_response }}"""

          val = None
          label = "Lentse Plas"
          source = "waterkaart.net"

          # Eerste keus: waterkaart.net (Lentse Plas)
          if waterkaart_temp:
              try:
                  val = round(float(waterkaart_temp.replace(",", ".")) * 10) / 10
                  print(f"Waterkaart.net temperatuur gebruikt: {val}")
              except Exception as e:
                  print(f"Kon waterkaart temp niet parsen: {e}", file=sys.stderr)

          # Fallback: RWS (Lobith)
          if val is None:
              label = "Lobith"
              source = "RWS"
              try:
                  data = json.loads(rws_raw)
                  metingen = []
                  for w in data.get("WaarnemingenLijst", []):
                      metingen.extend(w.get("MetingenLijst", []))
                  for m in metingen:
                      v = m.get("Meetwaarde", {}).get("Waarde_Numeriek")
                      if v is not None:
                          val = round(v * 10) / 10
                          break
              except Exception as e:
                  print(f"Parse fout RWS: {e}", file=sys.stderr)

          result = {
              "temperature": val,
              "label": label,
              "source": source,
              "updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          }

          with open("water-temp.json", "w") as f:
              json.dump(result, f)

          print("Resultaat:", result)
          PYEOF
        env:
          WATERKAART_TEMP: ${{ steps.waterkaart.outputs.waterkaart_temp }}

      - name: Update temp-history.json
        run: |
          python3 - <<'PYEOF'
          import json, datetime, os

          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          # Lees huidige water-temp.json
          try:
              with open("water-temp.json") as f:
                  wt = json.load(f)
          except Exception:
              wt = {}

          # Bepaal welke waarden bij welke bron horen
          waterkaart_val = None
          lobith_val     = None
          if wt.get("source") == "waterkaart.net":
              waterkaart_val = wt.get("temperature")
          elif wt.get("source") == "RWS":
              lobith_val = wt.get("temperature")

          # Lees bestaande history
          try:
              with open("temp-history.json") as f:
                  history = json.load(f)
          except Exception:
              history = []

          # Zoek vandaag op en update (of voeg toe)
          today_entry = next((e for e in history if e.get("date") == today), None)
          if today_entry is None:
              today_entry = {"date": today}
              history.append(today_entry)

          if waterkaart_val is not None:
              today_entry["waterkaart"] = waterkaart_val
          if lobith_val is not None:
              today_entry["lobith"] = lobith_val

          # Maximaal 365 dagen bewaren, nieuwste eerst
          history.sort(key=lambda e: e.get("date",""), reverse=True)
          history = history[:365]

          with open("temp-history.json", "w") as f:
              json.dump(history, f, indent=2)

          print(f"History bijgewerkt: {today_entry}")
          PYEOF

      - name: Commit en push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add water-temp.json temp-history.json
          git diff --staged --quiet && echo "Geen wijziging" || git commit -m "Update watertemperatuur [skip ci]"
          git push
