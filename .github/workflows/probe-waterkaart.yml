name: Probe waterkaart.net (tijdelijk)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch zwemplek-pagina en inspecteer
        run: |
          set -x
          URL="https://waterkaart.net/gids/zwemplek.php?naam=De%20Lentse%20Plas"

          # Poging 1: kale curl
          echo "=== Poging 1: kale curl ==="
          curl -s -o page1.html -w "HTTP %{http_code}, %{size_download} bytes\n" --max-time 20 "$URL" || true

          # Poging 2: browser headers
          echo "=== Poging 2: browser headers ==="
          curl -s -o page2.html -w "HTTP %{http_code}, %{size_download} bytes\n" --max-time 20 \
            -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: nl-NL,nl;q=0.9" \
            --compressed "$URL" || true

          for f in page1.html page2.html; do
            echo "=== Inhoud rond 'emperatu' in $f ==="
            grep -i -n -C 3 "emperatu" "$f" | head -80 || echo "(niets gevonden)"
            echo "=== Inhoud rond graden-teken in $f ==="
            grep -n -C 2 "°C" "$f" | head -40 || echo "(niets gevonden)"
            echo "=== Mogelijke XHR/API endpoints in $f ==="
            grep -o -E "(fetch|ajax|XMLHttpRequest|\.php[^\"']*)" "$f" | sort | uniq -c | sort -rn | head -30 || true
            grep -o -E "[a-zA-Z0-9_/.-]+\.php[^\"' <)]*" "$f" | sort -u | head -40 || true
          done

          echo "=== Eerste 60 regels page2.html ==="
          head -60 page2.html || true

      - name: Upload HTML als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waterkaart-html
          path: page*.html
          if-no-files-found: ignore
