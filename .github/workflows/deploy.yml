name: Deploy naar GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/iphone-temperature-tracker-app-YTAye
      - claude/add-firebase-setup-2se16

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vervang cache versie en build tijd
        run: |
          CACHE_VER=$(git rev-parse --short HEAD)
          sed -i "s/__CACHE_VER__/${CACHE_VER}/" sw.js
          BUILD_TIME=$(TZ='Europe/Amsterdam' date '+%Y-%m-%d %H:%M')
          sed -i "s/__BUILD_TIME__/${BUILD_TIME}/" index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
