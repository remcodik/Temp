name: Probe waterkwaliteit (tijdelijk)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch en toon kwaliteit-HTML
        run: |
          URL="https://waterkaart.net/gids/zwemplek.php?naam=De%20Lentse%20Plas"
          curl -s --max-time 20 \
            -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
            "$URL" -o page.html
          echo "HTTP-grootte: $(wc -c < page.html) bytes"
          echo "=== #data blok (kwaliteit) ==="
          # Pak de div id=data en toon leesbaar met regeleindes op tags
          python3 - <<'PY'
          import re
          html = open('page.html', encoding='utf-8', errors='replace').read()
          m = re.search(r'<div id="data">(.*?)</body>', html, re.S)
          block = m.group(1) if m else html
          # knip tot en met 'Foto' zodat we alleen de bovenkant zien
          cut = block.find('kop-stijl">Foto')
          if cut != -1: block = block[:cut]
          # zet elke tag op een nieuwe regel voor leesbaarheid
          pretty = re.sub(r'><', '>\n<', block)
          print(pretty)
          PY
